name: Deploy

on:
  push:
    branches: [main]

# A partial deploy from an overlapping run would race the collector's output;
# one deploy for the branch at a time (ticket 13 adds the scheduled trigger).
concurrency:
  group: deploy-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node collector/collect.ts
      - run: test -s static/data/index.json # every outlet failing shouldn't silently deploy an empty site
      - run: pnpm build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=ssreel
