name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # 00/06/12/18 Bangladesh time (UTC+6) = 18/00/06/12 UTC.
    - cron: '0 18,0,6,12 * * *'
  workflow_dispatch: {}

# A partial deploy from an overlapping run would race the collector's output;
# one deploy for the branch at a time, so two scheduled runs can't overlap.
concurrency:
  group: deploy-${{ github.ref }}

permissions:
  contents: write # scheduled runs commit the collector's dedupe state back

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # static/data and static/images are build artifacts (ADR-0002/0005), not
      # committed to git, but a Cloudflare Pages deploy replaces the whole
      # site every time — every build has to materialise the *whole*
      # retention window, not just the run just collected. The durable copy
      # lives as a release asset, entirely outside git history; the Actions
      # cache is only a fast path in front of it, since the cache alone is
      # evicted after 7 days idle or 10GB and would otherwise force
      # refetching the whole window from publishers (ADR-0010).
      - name: Restore collector output (fast path)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            static/data
            static/images
          key: collector-${{ github.run_id }}
          restore-keys: collector-

      - name: Restore collector output (durable fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p static/data static/images
          if gh release download collector-cache --pattern 'collector-output.tar.gz' --dir /tmp --clobber; then
            tar -xzf /tmp/collector-output.tar.gz -C static
          fi

      - run: node collector/collect.ts
      - run: test -s static/data/index.json # every outlet failing shouldn't silently deploy an empty site

      - name: Save collector output (fast path)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            static/data
            static/images
          key: collector-${{ github.run_id }}

      - name: Save collector output (durable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf /tmp/collector-output.tar.gz -C static data images
          gh release delete collector-cache --yes --cleanup-tag || true
          gh release create collector-cache /tmp/collector-output.tar.gz \
            --title "Collector output cache (not a release)" \
            --notes "Durable store for the collector's run data and images between builds. Not for humans."

      - name: Commit dedupe state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add collector/state.json
          git diff --cached --quiet || git commit -m "chore: update collector dedupe state [skip ci]"
          git push

      - run: pnpm build

      # wrangler pages deploy doesn't auto-create the project (unlike older
      # Pages CLI versions) — idempotent, so this is a no-op once the project
      # exists and never needs a manual dashboard click again.
      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages project list | grep -qw ssreel || \
            pnpm exec wrangler pages project create ssreel --production-branch=main

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=ssreel
